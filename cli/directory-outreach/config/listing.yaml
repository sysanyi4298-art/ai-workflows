audience: 个人开发者和技术团队
detail: 平台同时提供模型价格与编程工具配置资料，方便用户了解调用成本并完成接入。对于多个项目或团队成员的使用需求，还可以通过独立 API Key 设置消费限额和可用模型，管理各自的使用范围。
